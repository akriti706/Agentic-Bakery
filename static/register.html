<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Agentic Bakers</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="login-form">
      <h1>Bakers</h1>
      <div class="container">
        <div class="main">
          <div class="content">
            <h2>Create Account</h2>
            <form action="" method="post" id="register-form">
              <input type="text" name="name" id="name" placeholder="full name" required autofocus>
              <input type="email" name="email" id="email" placeholder="email id" required>
              <input type="password" name="password" id="password" placeholder="password" required>
              <input type="password" name="confirm-password" id="confirm-password" placeholder="confirm password" required>
              <button class="btn" type="submit">Register</button>
            </form>
            <p class="account">Already have an account? <a href="/static/index.html">Log in</a></p>
          </div>
        </div>
      </div>
    </div>
    <script>
      const registerForm = document.getElementById('register-form');
      const userPassword = document.getElementById('password');
      const confirmPassword = document.getElementById('confirm-password');
      const userName = document.getElementById('name');
      const userEmail = document.getElementById('email');

      function validatePasswords() {
        confirmPassword.setCustomValidity(
          userPassword.value === confirmPassword.value ? '' : 'Passwords do not match.'
        );
      }

      userPassword.addEventListener('input', validatePasswords);
      confirmPassword.addEventListener('input', validatePasswords);
      registerForm.addEventListener('submit', async function(event) {
        event.preventDefault();
        validatePasswords();

        if (!registerForm.checkValidity()) {
          if (confirmPassword.validationMessage) {
            alert(confirmPassword.validationMessage);
          }
          return;
        }

        try {
          const res = await fetch('/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              email: userEmail.value,
              password: userPassword.value,
              name: userName.value
            })
          });
          const data = await res.json();

          if (res.ok) {
            alert(
              'Registration successful!\n' +
              'Your Customer ID is: ' + data.customer_id
            );
          } else {
            alert('Registration failed! Try again');
          }
        } catch (error) {
          alert('Unable to connect to the server.');
        }
      });

    </script>
  </body>
</html>
